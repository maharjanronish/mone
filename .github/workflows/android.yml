name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Flutter Release APK (Android 8.0+)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # This project is from the Dart 2.x era (pubspec sdk >=2.7.0 <3.0.0).
      # Flutter 2.10.5 ships Dart 2.16 and can still resolve & compile it.
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '2.10.5'
          channel: 'stable'
          cache: true

      - name: Java setup
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Vendor legacy transitive packages
        run: |
          # The app's original lockfile used platform 1.0.2 / process 1.2.0 /
          # path_provider_platform_interface 2.0.0 (pre-null-safe versions that pub.dev
          # no longer serves archives for, and whose newest replacements don't compile on
          # Dart 2.16). These are pure infrastructure deps of path_provider — the app code
          # never imports them directly. We vendor byte-for-byte copies of the sources at
          # those exact versions (from their GitHub tags) so the built APK is identical in
          # behavior to the original app. No application code is modified.
          mkdir -p vendor
          git clone -q --depth 1 --branch v1.0.2 https://github.com/google/platform.dart vendor/platform
          git clone -q --depth 1 --branch v1.2.0 https://github.com/google/process_package vendor/process
          git clone -q --depth 1 --branch path_provider_platform_interface-v2.0.0 https://github.com/flutter/packages vendor/plugins
          mv vendor/plugins/packages/path_provider/path_provider_platform_interface vendor/pppi
          rm -rf vendor/plugins
          # relax old SDK constraints so Dart 2.16 accepts them (behavior unchanged)
          sed -i -E "s/sdk: ['\"]>=1[^'\"]*['\"]/sdk: '>=2.12.0 <3.0.0'/; s/sdk: ['\"]>=2\\.[0-9]+\\.[0-9]+ <2\\.0\\.0['\"]/sdk: '>=2.12.0 <3.0.0'/" vendor/platform/pubspec.yaml vendor/process/*/pubspec.yaml vendor/pppi/pubspec.yaml
          grep -H "sdk:" vendor/platform/pubspec.yaml vendor/pppi/pubspec.yaml
          ls vendor
      - name: Add dependency overrides
        run: |
          cat >> pubspec.yaml <<'EOF'

          dependency_overrides:
            platform:
              path: ./vendor/platform
            process:
              path: ./vendor/process/packages/process
            path_provider_platform_interface:
              path: ./vendor/pppi
          EOF
          tail -10 pubspec.yaml

      - name: Install dependencies
        run: flutter pub get

      # Upstream builds with the deprecated v1 Android embedding;
      # --ignore-deprecation keeps the exact same manifest/app behavior.
      - name: Build Debug APK
        run: flutter build apk --debug --ignore-deprecation

      - name: Build Release APK
        run: flutter build apk --release --ignore-deprecation

      - name: Build Split APKs per ABI
        run: flutter build apk --release --split-per-abi --ignore-deprecation

      - name: Collect artifacts
        run: |
          mkdir -p artifact
          cp build/app/outputs/flutter-apk/app-debug.apk artifact/Churu-debug.apk
          cp build/app/outputs/flutter-apk/app-release.apk artifact/Churu-release.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk artifact/ || true
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk artifact/ || true
          ls -la artifact

      - name: Upload APKs to GitHub Actions artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Churu-APK
          path: artifact/*.apk
          if-no-files-found: error

      - name: Attach APKs to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Churu APK (latest build, Android 8.0+)
          body: Automatically built release APK of the Churu (出入) Flutter expense app. minSdk 21 — fully compatible with Android 8.0+.
          files: artifact/*.apk
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
